<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho — Livraria Exemplo</title><link rel="stylesheet" href="estilo.css"><script src="loja.js"></script></head><body><script>topo()</script>
<main><h1>Seu carrinho</h1><p class="sub">Confira os itens antes de finalizar.</p><table id="t"></table><div class="total"><div>Total: <b id="tot"></b></div><a class="btn amarelo" href="checkout.html">Finalizar compra</a></div></main>
<script>const c=carrinho();let s=0;document.getElementById('t').innerHTML='<tr><th>Livro</th><th>Qtd.</th><th>Preço</th></tr>'+(c.length?c.map(id=>{s+=LIVROS[id].p;return `<tr><td>${LIVROS[id].t}</td><td>1</td><td>${real(LIVROS[id].p)}</td></tr>`}).join(''):'<tr><td colspan=3>Carrinho vazio</td></tr>');document.getElementById('tot').textContent=real(s)</script></body></html>
