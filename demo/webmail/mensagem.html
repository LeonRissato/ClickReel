<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redefinição de senha — Correio Exemplo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Segoe UI",system-ui,sans-serif;background:#f6f8fc;color:#1f1f1f}

<div class="corpo"><h2>Livraria Exemplo</h2><p>Olá! Alguém pediu para redefinir a senha da sua conta.</p><p>Se foi você, clique no botão abaixo:</p>
